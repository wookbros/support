---
name: Feature Request
description: Suggest a new feature or improvement
labels: ["feature"]
body:
  - type: textarea
    attributes:
      label: Description
      description: What feature would you like?
      placeholder: Describe the feature...
    validations:
      required: true
  - type: textarea
    attributes:
      label: Use Case
      description: Why do you need this?
      placeholder: Describe your use case...
  - type: input
    attributes:
      label: Service
      description: Which service is this for?
      placeholder: e.g., 양실장, website
